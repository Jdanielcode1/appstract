name: ConvexDashboard
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ConvexDashboard:
    type: application
    platform: iOS
    sources:
      - path: ConvexDashboard
    dependencies:
      - target: ConvexWidgets
    # Shared scheme for running the app (the widget extension builds as a dependency).
    scheme:
      gatherCoverageData: false
    entitlements:
      path: ConvexDashboard/ConvexDashboard.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.dcantu.convexdashboard.shared]
    info:
      path: ConvexDashboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.dcantu.convexdashboard.shared
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.dcantu.convexdashboard.alerts]
        NSFaceIDUsageDescription: Face ID keeps your Convex access token and data private to you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).convexdashboard
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Convex Go"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Home Screen + Lock Screen widgets. Reads the token from the shared keychain group and loads
  # its own data (ConvexDashboard/Services/WidgetData.swift).
  ConvexWidgets:
    type: app-extension
    platform: iOS
    scheme:
      gatherCoverageData: false
    sources:
      - path: ConvexWidgets
      - path: ConvexDashboard/Services/WidgetData.swift
      - path: ConvexDashboard/Services/KeychainStore.swift
      - path: ConvexDashboard/Models/Models.swift
      - path: ConvexDashboard/Theme/Theme.swift
      - path: ConvexDashboard/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: ConvexWidgets/ConvexWidgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.dcantu.convexdashboard.shared]
    info:
      path: ConvexWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Convex Go"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.dcantu.convexdashboard.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).convexdashboard.widgets
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
